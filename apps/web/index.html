<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LOCD Engine workload placement decision playground.">
  <title>LOCD Engine — Decision Console</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body { margin: 0; background: #080b14; color: #f4f7ff; }
    main { max-width: 1180px; margin: 0 auto; padding: 32px 20px 60px; }
    header { display: flex; justify-content: space-between; gap: 16px; align-items: end; margin-bottom: 24px; }
    .eyebrow { color: #8ab4ff; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 6px 0 0; font-size: clamp(32px, 6vw, 58px); letter-spacing: -.04em; }
    .muted { color: #9da8c2; line-height: 1.65; }
    .layout { display: grid; grid-template-columns: minmax(280px, .9fr) minmax(320px, 1.1fr); gap: 18px; }
    .card { background: #111728; border: 1px solid #27314a; border-radius: 18px; padding: 20px; }
    label { display: grid; gap: 7px; color: #c9d1e5; font-size: 13px; margin-bottom: 14px; }
    input, select, button {
      width: 100%; box-sizing: border-box; border-radius: 10px; border: 1px solid #35415f;
      background: #0c1220; color: #f4f7ff; padding: 11px 12px; font: inherit;
    }
    button { cursor: pointer; background: #1d4ed8; border-color: #2563eb; font-weight: 700; }
    button:hover { filter: brightness(1.08); }
    .result { min-height: 360px; }
    .route { font-size: 44px; font-weight: 800; letter-spacing: -.04em; text-transform: uppercase; }
    .score { color: #9da8c2; }
    .pill { display: inline-flex; border: 1px solid #35415f; border-radius: 999px; padding: 5px 9px; margin: 4px 4px 0 0; font-size: 12px; }
    ul { padding-left: 18px; color: #bac4db; line-height: 1.7; }
    pre { overflow: auto; background: #0a0f1c; border: 1px solid #27314a; border-radius: 12px; padding: 14px; font-size: 12px; }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } header { display: block; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <div class="eyebrow">Local · Private · Cloud · Hybrid</div>
        <h1>Decision Console</h1>
      </div>
      <div class="muted">The engine filters hard policy constraints before optimizing eligible targets.</div>
    </header>

    <section class="card" style="margin-bottom:18px">
      <div class="eyebrow">Live telemetry</div>
      <div id="metrics" class="muted">No decisions recorded yet.</div>
    </section>
    <div class="layout">
      <section class="card">
        <h2>Workload</h2>
        <label>
          Type
          <input id="workloadType" value="llm-inference">
        </label>
        <label>
          Sensitivity
          <select id="sensitivity">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high" selected>High</option>
          </select>
        </label>
        <label>
          Privacy policy
          <select id="privacyMode">
            <option value="balanced">Balanced</option>
            <option value="prefer-local">Prefer local</option>
            <option value="local-only" selected>Local only</option>
            <option value="private-only">Private boundary only</option>
          </select>
        </label>
        <label>
          Latency budget (ms)
          <input id="latency" type="number" value="800" min="0">
        </label>
        <label>
          Maximum cost (USD)
          <input id="cost" type="number" value="0.05" min="0" step="0.001">
        </label>
        <button id="decide">Evaluate workload</button>
      </section>

      <section class="card result" aria-live="polite">
        <div class="eyebrow">Engine output</div>
        <div id="output" class="muted">Ready. Run a decision to see route, confidence, alternatives and policy rejections.</div>
      </section>
    </div>
  </main>
  <script src="/app.js"></script>
</body>
</html>

services:
  locd:
    build: .
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: production
      PORT: 8787
      LOCD_STATE_DB_FILE: /data/locd.db
    volumes:
      - locd_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  locd_data:

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: npm ci
      - name: Test (capture)
        shell: bash
        run: |
          set +e
          npm test > test-output.txt 2>&1
          code=$?
          echo "$code" > test-exit-code.txt
          cat test-output.txt
          exit 0

      - name: Publish test diagnostics
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const output = fs.existsSync("test-output.txt")
              ? fs.readFileSync("test-output.txt", "utf8")
              : "test-output.txt was not created";
            const code = fs.existsSync("test-exit-code.txt")
              ? fs.readFileSync("test-exit-code.txt", "utf8").trim()
              : "unknown";
            const body = [
              "### CI test diagnostics",
              "",
              `exit code: ${code}`,
              "",
              "```text",
              output.slice(-60000),
              "```"
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Fail when tests fail
        shell: bash
        run: |
          code=$(cat test-exit-code.txt)
          exit "$code"
      - name: Syntax lint
        run: npm run lint
      - name: Smoke test
        run: |
          node apps/api/src/server.js &
          PID=$!
          trap "kill $PID" EXIT
          for i in {1..10}; do
            curl --fail --silent http://127.0.0.1:8787/health && exit 0
            sleep 1
          done
          exit 1

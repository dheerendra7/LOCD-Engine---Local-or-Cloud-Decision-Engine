name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: locd_test
          POSTGRES_USER: locd
          POSTGRES_PASSWORD: locd_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U locd -d locd_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LOCD_TEST_DATABASE_URL: postgres://locd:locd_test_password@localhost:5432/locd_test
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Syntax lint
        run: npm run lint
      - name: Smoke test
        run: |
          node apps/api/src/server.js &
          PID=$!
          trap "kill $PID" EXIT
          for i in {1..10}; do
            curl --fail --silent http://127.0.0.1:8787/health && exit 0
            sleep 1
          done
          exit 1
      - name: Decision benchmark smoke
        run: node scripts/bench-decision.mjs 100 1000

name: One-time branch archive and cleanup

on:
  push:
    branches:
      - feature/light-control-console

permissions:
  contents: write

jobs:
  archive-and-prune:
    if: github.ref == 'refs/heads/feature/light-control-console'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Archive every non-kept branch head, then prune refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          node <<'NODE'
          const repository = process.env.REPOSITORY;
          const token = process.env.GH_TOKEN;
          const api = "https://api.github.com";
          const keep = new Set([
            "main",
            "fix/relative-cost-scoring",
            "feature/light-control-console",
            "feature/tenant-control-plane",
            "feature/sqlite-state",
            "feature/security-baseline"
          ]);
          const expectedBranchCount = 109;
          const expectedMainSha = "1390bb271df9bd43ccfeb4a5664db2eb745c6351";
          const headers = {
            authorization: `Bearer ${token}`,
            accept: "application/vnd.github+json",
            "x-github-api-version": "2022-11-28",
            "content-type": "application/json"
          };

          if (!repository || !token) throw new Error("Repository/token context unavailable; nothing deleted.");

          async function request(path, options = {}) {
            const response = await fetch(api + path, {
              ...options,
              headers: { ...headers, ...(options.headers || {}) }
            });
            const raw = await response.text();
            let body = null;
            if (raw) {
              try { body = JSON.parse(raw); } catch { body = raw; }
            }
            return { response, body, raw };
          }

          async function requireJson(path) {
            const result = await request(path);
            if (!result.response.ok) {
              throw new Error(`GET ${path} failed: ${result.response.status} ${result.raw.slice(0, 500)}`);
            }
            return result.body;
          }

          const encodeSegments = value => value.split("/").map(encodeURIComponent).join("/");

          async function listAllBranches() {
            const result = [];
            for (let page = 1; ; page += 1) {
              const batch = await requireJson(`/repos/${repository}/branches?per_page=100&page=${page}`);
              if (!Array.isArray(batch)) throw new Error("Unexpected branch list response; nothing deleted.");
              result.push(...batch);
              if (batch.length < 100) break;
            }
            return result;
          }

          const branches = await listAllBranches();
          if (branches.length !== expectedBranchCount) {
            throw new Error(`Safety stop: expected ${expectedBranchCount} audited branches, found ${branches.length}. Nothing deleted.`);
          }
          const missing = [...keep].filter(name => !branches.some(item => item.name === name));
          if (missing.length) throw new Error(`Safety stop: keep branch missing: ${missing.join(", ")}. Nothing deleted.`);

          const mainRef = await requireJson(`/repos/${repository}/git/ref/heads/main`);
          if (mainRef.object?.sha !== expectedMainSha) {
            throw new Error("Safety stop: main moved since audit. Nothing deleted.");
          }

          const openPulls = await requireJson(`/repos/${repository}/pulls?state=open&per_page=100`);
          const unpreservedPullHeads = openPulls
            .map(pull => pull.head?.ref)
            .filter(name => name && !keep.has(name));
          if (unpreservedPullHeads.length) {
            throw new Error(`Safety stop: an open PR head is not preserved: ${[...new Set(unpreservedPullHeads)].join(", ")}. Nothing deleted.`);
          }

          const protectedBranches = branches
            .filter(item => !keep.has(item.name) && item.protected)
            .map(item => item.name);
          if (protectedBranches.length) {
            throw new Error(`Safety stop: protected branch(s) outside keep set: ${protectedBranches.join(", ")}. Nothing deleted.`);
          }

          const obsolete = branches.filter(item => !keep.has(item.name));
          const day = new Date().toISOString().slice(0, 10);
          console.log(`Preflight passed: ${branches.length} branches; retaining ${keep.size}; archiving ${obsolete.length}.`);

          // Create and independently verify an archive tag for EVERY branch before deleting any branch.
          let archived = 0;
          for (const item of obsolete) {
            const shortSha = item.commit.sha.slice(0, 12);
            const tag = `archive/branch-tips/${day}/${item.name}/${shortSha}`;
            const refPath = `/repos/${repository}/git/ref/${encodeSegments("tags/" + tag)}`;
            let tagResult = await request(refPath);

            if (tagResult.response.status === 404) {
              tagResult = await request(`/repos/${repository}/git/refs`, {
                method: "POST",
                body: JSON.stringify({ ref: `refs/tags/${tag}`, sha: item.commit.sha })
              });
              if (tagResult.response.status === 422) {
                // A previous safe run may have created this tag; fetch and verify it below.
                tagResult = await request(refPath);
              } else if (!tagResult.response.ok) {
                throw new Error(`Archive tag create failed for ${item.name}: ${tagResult.response.status} ${tagResult.raw.slice(0, 500)}. No branch deletion has started.`);
              }
            }

            if (!tagResult.response.ok || tagResult.body?.object?.sha !== item.commit.sha) {
              throw new Error(`Archive verification failed for ${item.name}; expected ${item.commit.sha}. No branch deletion has started.`);
            }
            archived += 1;
          }

          if (archived !== obsolete.length) {
            throw new Error(`Safety stop: verified only ${archived}/${obsolete.length} archive tags. No branch deletion has started.`);
          }
          console.log(`Archive verified: ${archived} branch tips preserved as tags. Starting branch-ref cleanup.`);

          let deleted = 0;
          for (const item of obsolete) {
            const refPath = `/repos/${repository}/git/refs/heads/${encodeSegments(item.name)}`;
            const result = await request(refPath, { method: "DELETE" });
            if (result.response.status === 404) continue;
            if (result.response.status !== 204) {
              throw new Error(`Branch delete failed for ${item.name}: ${result.response.status} ${result.raw.slice(0, 500)}. All branch tips were archived first.`);
            }
            deleted += 1;
          }

          const finalBranches = await listAllBranches();
          const actual = finalBranches.map(item => item.name).sort();
          const expected = [...keep].sort();
          if (actual.length !== expected.length || actual.some((name, index) => name !== expected[index])) {
            throw new Error(`Post-delete verification mismatch. Actual branches: ${actual.join(", ")}. Archive tags remain available.`);
          }

          console.log(`SUCCESS: ${deleted} branch refs removed; exactly ${actual.length} branches remain:`);
          for (const name of actual) console.log(`  - ${name}`);
          console.log(`Archive namespace: refs/tags/archive/branch-tips/${day}/`);
          NODE

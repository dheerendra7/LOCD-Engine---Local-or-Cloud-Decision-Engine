openapi: 3.1.0
info:
  title: LOCD Engine API
  version: 1.0.0
  description: Vendor-neutral workload placement decision API.
servers:
  - url: http://localhost:8787
paths:
  /health:
    get:
      summary: Service health
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/decide:
    post:
      summary: Decide execution placement
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
      responses:
        "200":
          description: Decision result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResponse"
        "413":
          description: Request body too large
        "429":
          description: Rate limit exceeded
        "400":
          description: Invalid request
        "401":
          description: Authentication required
        "503":
          description: No registered execution targets


  /v1/policies:
    get:
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      summary: List reusable policy profiles
      responses:
        "200":
          description: Policy profile catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  policies:
                    type: array
                    items:
                      type: object

  /v1/targets:
    get:
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      summary: List registered execution targets
      responses:
        "200":
          description: Registered targets
    post:
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      summary: Register an execution target
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Target"
      responses:
        "201":
          description: Target registered
        "413":
          description: Request body too large
        "429":
          description: Rate limit exceeded
        "400":
          description: Invalid target
  /v1/targets/{id}:
    delete:
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      summary: Remove a registered execution target
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Target removed
        "404":
          description: Target not found

  /v1/hybrid-plan:
    post:
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      summary: Validate a multi-stage hybrid execution plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HybridPlanRequest"
      responses:
        "200":
          description: Hybrid plan result
        "413":
          description: Request body too large
        "429":
          description: Rate limit exceeded
        "400":
          description: Invalid plan request
        "401":
          description: Authentication required
        "503":
          description: No registered execution targets

  /v1/targets/{id}/heartbeat:
    post:
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      summary: Update execution target heartbeat telemetry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                available: {type: boolean}
                health: {type: number, minimum: 0, maximum: 1}
                capacity: {type: number, minimum: 0, maximum: 1}
                privacy: {type: number, minimum: 0, maximum: 1}
                estimatedLatencyMs: {type: number, minimum: 0}
                estimatedCostUsd: {type: number, minimum: 0}
                availableMemoryGb: {type: number, minimum: 0}
                maxContextTokens: {type: number, minimum: 0}
                regions:
                  type: array
                  items: {type: string}
                capabilities:
                  type: array
                  items: {type: string}
      responses:
        "200":
          description: Heartbeat accepted
        "413":
          description: Request body too large
        "429":
          description: Rate limit exceeded
        "400":
          description: Invalid heartbeat
        "401":
          description: Authentication required
        "404":
          description: Target not found
        "501":
          description: Target does not support heartbeat updates

  /v1/outcomes:
    post:
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      summary: Record the observed outcome for a prior decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionOutcomeRequest"
      responses:
        "200":
          description: Outcome recorded
        "413":
          description: Request body too large
        "429":
          description: Rate limit exceeded
        "400":
          description: Invalid outcome request
        "401":
          description: Authentication required
        "404":
          description: Decision not found

  /v1/decisions:
    get:
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      summary: Recent decision metadata
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: Recent decision events
  /v1/metrics:
    get:
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      summary: Decision aggregates
      responses:
        "200":
          description: Aggregate metrics
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API-Key
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-LOCD-API-Key
  schemas:
    Target:
      type: object
      required: [id, mode]
      properties:
        id: {type: string}
        mode:
          type: string
          enum: [local, private, cloud, hybrid]
        available: {type: boolean}
        health: {type: number, minimum: 0, maximum: 1}
        capacity: {type: number, minimum: 0, maximum: 1}
        privacy: {type: number, minimum: 0, maximum: 1}
        estimatedLatencyMs: {type: number, minimum: 0}
        estimatedCostUsd: {type: number, minimum: 0}
        availableMemoryGb: {type: number, minimum: 0}
        maxContextTokens: {type: number, minimum: 0}
        lastHeartbeatAt:
          type: [string, "null"]
          format: date-time
        regions:
          type: array
          items: {type: string}
        capabilities:
          type: array
          items: {type: string}
    Workload:
      type: object
      required: [type]
      properties:
        type: {type: string}
        sensitivity:
          type: string
          enum: [low, medium, high]
        requiredMemoryGb: {type: number, minimum: 0}
        requiredContextTokens: {type: number, minimum: 0}
        requiredCapabilities:
          type: array
          items: {type: string}
    Constraints:
      type: object
      properties:
        latencyBudgetMs: {type: number, minimum: 0}
        maxCostUsd: {type: number, minimum: 0}
        strictLatency: {type: boolean}
        strictCost: {type: boolean}
    Policy:
      type: object
      properties:
        allowedModes:
          type: array
          items:
            type: string
            enum: [local, private, cloud, hybrid]
        blockedModes:
          type: array
          items:
            type: string
            enum: [local, private, cloud, hybrid]
        allowedRegions:
          type: array
          items: {type: string}
        sensitiveDataMode:
          type: string
          enum: [balanced, prefer-local, local-only, private-only]
        maxHeartbeatAgeMs: {type: number, minimum: 0}
    DecisionRequest:
      type: object
      required: [workload]
      properties:
        workload: {$ref: "#/components/schemas/Workload"}
        constraints: {$ref: "#/components/schemas/Constraints"}
        policy: {$ref: "#/components/schemas/Policy"}
        targets:
          description: Optional for request-scoped simulation. When omitted, registered targets are used.
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/Target"}
    DecisionResponse:
      type: object
      required: [decisionVersion, route, targetId, confidence, score]
      properties:
        decisionVersion: {type: string}
        route:
          type: string
          enum: [local, private, cloud, hybrid, none]
        targetId:
          type: [string, "null"]
        confidence: {type: number, minimum: 0, maximum: 1}
        score: {type: number, minimum: 0, maximum: 1}
        decisionId: {type: string}
        estimated:
          type: [object, "null"]
          properties:
            latencyMs: {type: [number, "null"]}
            costUsd: {type: [number, "null"]}
        reasons:
          type: array
          items: {type: string}
        alternatives:
          type: array
          items:
            type: object
        rejected:
          type: array
          items:
            type: object
        evaluated:
          type: array
          items:
            type: object
    HybridPlanRequest:
      type: object
      required: [workload, steps]
      properties:
        workload:
          $ref: "#/components/schemas/Workload"
        policy:
          $ref: "#/components/schemas/Policy"
        constraints:
          type: object
          properties:
            maxLatencyMs: {type: number, minimum: 0}
            maxCostUsd: {type: number, minimum: 0}
            strictLatency: {type: boolean}
            strictCost: {type: boolean}
        targets:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Target"
        steps:
          type: array
          minItems: 2
          items:
            type: object
            required: [id, targetId]
            properties:
              id: {type: string}
              purpose: {type: string}
              targetId: {type: string}
              dataSensitivity:
                type: string
                enum: [low, medium, high]
    DecisionOutcomeRequest:
      type: object
      required: [decisionId, outcome]
      properties:
        decisionId: {type: string}
        outcome:
          type: string
          enum: [success, failure]
        actualLatencyMs: {type: number, minimum: 0}
        actualCostUsd: {type: number, minimum: 0}
        errorClass: {type: string}
        timestamp: {type: string, format: date-time}
    Health:
      type: object
      properties:
        status: {type: string}
        service: {type: string}
        version: {type: string}

# Authentication note: when LOCD_API_KEY is configured, all /v1 operations
# require bearerAuth or apiKeyHeader. /health remains public.
